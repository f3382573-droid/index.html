<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة الحضارة اليونانية</title>
<style>
body{margin:0;background:#07192d;color:white;font-family:Tahoma;text-align:center}
h1{color:#ffd45a;font-size:40px}
.game{display:flex;justify-content:center;align-items:center;gap:30px}
canvas{background:white;border-radius:50%}
.card{background:#fff;color:#172238;width:430px;padding:25px;border-radius:20px}
.choice{background:#eee;margin:8px;padding:10px;border-radius:8px;font-size:18px}
.correct{background:#20b957!important;color:white}
.timer{font-size:35px;color:red;font-weight:bold}
button{background:#ffd044;border:0;padding:15px 35px;border-radius:12px;font-size:22px}
</style>
</head>
<body>

<h1>🎡 لعبة الحضارة اليونانية</h1>

<div class="game">
<div>
<div style="font-size:55px;color:#ffd044">▼</div>
<canvas id="wheel" width="560" height="560"></canvas>
<br>
<button onclick="spin()">ابدأ الدوران</button>
</div>

<div class="card" id="card">ابدأ الدوران لاختيار الطالب</div>
</div>

<script>
const data=[
["بختة سالم","ظهرت مظاهر الحضارة اليونانية منذ القرن:",["الخامس قبل الميلاد","الثامن قبل الميلاد","العاشر قبل الميلاد","الثاني قبل الميلاد"],1],
["حور حمود","كان نظام الحكم في بداية الحضارة اليونانية:",["الديمقراطي","الملكي","الجمهوري","النيابي"],1],
["روان عبدالحافظ","كان الملك في النظام الملكي يسيطر على:",["التجارة فقط","جميع شؤون البلاد","الزراعة فقط","الصناعة فقط"],1],
["زملة علي","حكم النظام الأوليجاركي مجموعة من:",["الفلاحين","العبيد","النبلاء وأصحاب الثروة","الجنود فقط"],2],
["سارة عبدالرحمن","ظهر النظام الديمقراطي في مدينة:",["روما","أثينا","بابل","فارس"],1],
["عائشة صالح","اعتمد النظام الديمقراطي على:",["حكم الملك","مشاركة المواطنين","حكم النبلاء","إلغاء القوانين"],1],
["غدير ياسر","ساعدت الطبيعة الجغرافية لليونان على تنوع:",["اللغات","الأنشطة الاقتصادية","الملابس","العادات فقط"],1],
["فاخرة محمد","من أهم الأنشطة الاقتصادية في اليونان:",["الزراعة","الصناعة","التجارة","كل ما سبق"],3],
["فاطمة محمد","من المحاصيل التي زرعها اليونانيون:",["القمح والشعير","القطن","الأرز","الشاي"],0],
["لمى طالب","اهتم اليونانيون بزراعة:",["الزيتون والعنب","النخيل فقط","القطن والكتان","الأرز والذرة"],0],
["مبخوتة صالح","استخدم اليونانيون الزيتون في صناعة:",["السفن","الزيوت","الأسلحة","الملابس"],1],
["مريم مشعل","برع اليونانيون في صناعة:",["السيارات","الفخار","الطائرات","الأجهزة الإلكترونية"],1],
["مشاعل فلاح","ازدهرت صناعة السفن بسبب أن بلاد اليونان:",["صحراوية","ساحلية","جليدية","بعيدة عن البحار"],1],
["ملاك حزام","من الصناعات التي اشتهر بها اليونانيون:",["الأدوات الحربية والمجوهرات","الحواسيب","السيارات","الطائرات"],0],
["ملاك عبدالرحمن","صدرت اليونان إلى بلاد الشرق:",["المعادن","الحبوب والزيتون والخمر","الأخشاب فقط","الملابس"],1],
["ملوك محمود","استوردت اليونان:",["المعادن والمنتجات المختلفة","الزيتون","الخمر","الحبوب"],0],
["مهرة فرحان","كان من مظاهر الحضارة اليونانية:",["النظام السياسي","الحياة الاقتصادية","الصناعة والتجارة","كل ما سبق"],3],
["نجود محمد","من المدن التي ظهر بها النظام الديمقراطي:",["أثينا","القاهرة","روما","دمشق"],0],
["ندى وائل","اهتم اليونانيون بصناعة:",["السفن","الطائرات","السيارات","القطارات"],0],
["نود مبارك","ساعد الموقع والتضاريس والمناخ في:",["تنوع الموارد الاقتصادية","توقف التجارة","قلة الزراعة","اختفاء الصناعة"],0],
["هند عناد","من الأنشطة الاقتصادية التي مارسها اليونانيون:",["التجارة","الزراعة","الصناعة","جميع ما سبق"],3],
["وسام عناد","كانت حضارة بلاد الإغريق من الحضارات:",["القديمة","الحديثة","المعاصرة","المستقبلية"],0]
];

let names=data.map(x=>x[0]),angle=0,ctx=document.getElementById("wheel").getContext("2d");

function draw(){
let r=280,p=2*Math.PI/names.length;
ctx.clearRect(0,0,560,560);
names.forEach((n,i)=>{
let a=angle+i*p;
ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r,a,a+p);
ctx.fillStyle=`hsl(${i*18},70%,50%)`;ctx.fill();ctx.stroke();
ctx.save();ctx.translate(r,r);ctx.rotate(a+p/2);
ctx.fillStyle="white";ctx.font="bold 12px Tahoma";ctx.fillText(n,140,0);
ctx.restore();
});
}
draw();

function spin(){
let speed=.5;
let id=setInterval(()=>{
angle+=speed;speed*=.985;draw();
if(speed<.003){
clearInterval(id);
let i=Math.floor(Math.random()*names.length);
let q=data.find(x=>x[0]==names[i]);
names.splice(i,1);
show(q);
draw();
}},20);
}

function show(q){
let sec=10;
card.innerHTML="<h2>🎉 "+q[0]+"</h2><h3>"+q[1]+"</h3>"+
q[2].map((x,i)=>"<div class='choice' id='c"+i+"'>"+x+"</div>").join("")+
"<div class='timer' id='timer'>10</div>";
let t=setInterval(()=>{
sec--;timer.innerHTML=sec;
if(sec<=0){
clearInterval(t);
document.getElementById("c"+q[3]).className="choice correct";
}
},1000);
}
</script>
</body>
</html>
